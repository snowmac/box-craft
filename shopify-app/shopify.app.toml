# Hand-scaffolded to match the structure `shopify app init` generates.
# client_id and dev_store_url below are real. application_url and the
# auth redirect URL are still placeholders until workers/app-backend is
# actually deployed — run scripts/setup-cloudflare.mjs (needs a local
# `wrangler login`) to deploy it and fill these in automatically. See
# specs/product/assumptions.md.

client_id = "d3f114303ecd6de5e650b4bdb96106f6"
name = "BoxCraft"
handle = "boxcraft"
application_url = "https://box-craft-app-backend.adam-bourg.workers.dev"
embedded = true

[build]
automatically_update_urls_on_dev = true
dev_store_url = "box-craft-demo.myshopify.com"

[webhooks]
api_version = "2026-01"

  [[webhooks.subscriptions]]
  topics = [ "app/uninstalled" ]
  uri = "/webhooks/app/uninstalled"

[access_scopes]
# read_inventory + read_locations: the Guardrail Worker's backfill script
# and the webhook consumer's inventory_levels/update subscription both
# need these. read_products: theme app extension needs variant data for
# the Pick-N picker config.
scopes = "read_inventory,read_locations,read_products"

[auth]
redirect_urls = [ "https://box-craft-app-backend.adam-bourg.workers.dev/auth/callback" ]
