# Hand-scaffolded to match the structure `shopify app init` generates.
# client_id, dev_store_url, application_url, and the auth redirect URL
# below are all real — workers/app-backend is deployed. Still needed:
# `shopify app deploy` from this directory (needs `shopify login`) to
# actually register this config with the Partner app. See
# specs/product/assumptions.md.

client_id = "d3f114303ecd6de5e650b4bdb96106f6"
name = "BoxCraft"
handle = "boxcraft-bundles"
application_url = "https://box-craft-app-backend.adam-bourg.workers.dev"
embedded = true

[build]
automatically_update_urls_on_dev = true
dev_store_url = "box-craft-demo.myshopify.com"

[webhooks]
api_version = "2026-01"

  [[webhooks.subscriptions]]
  topics = [ "app/uninstalled" ]
  uri = "/webhooks/app/uninstalled"

  # Handled by workers/webhook-consumer (a separate Worker from
  # application_url), so this needs an absolute URI.
  [[webhooks.subscriptions]]
  topics = [ "inventory_levels/update" ]
  uri = "https://box-craft-webhook-consumer.adam-bourg.workers.dev/webhooks/inventory-levels-update"

  # T10/D13: bundle sales attribution. DISABLED — `shopify app deploy`
  # rejects an orders/paid subscription until Shopify approves this app
  # for Protected Customer Data, which turned out to be required even for
  # dev-store deploys (see assumptions.md). Re-enable once PCD access is
  # granted in the Partner Dashboard.
  # [[webhooks.subscriptions]]
  # topics = [ "orders/paid" ]
  # uri = "https://box-craft-webhook-consumer.adam-bourg.workers.dev/webhooks/orders-paid"

[access_scopes]
# read_inventory + read_locations: the Guardrail Worker's backfill script
# and the webhook consumer's inventory_levels/update subscription both
# need these. write_products (implies read_products): the theme extension
# reads variant data, and app-backend creates the hidden "BoxCraft Bundle"
# parent product at install. write_cart_transforms: app-backend activates
# the Cart Transform function on each store (cartTransformCreate).
# write_publications: app-backend publishes the bundle parent product to
# the Online Store — Shopify skips linesMerge for an unpublished parent.
# read_orders (bundle sales attribution) is temporarily withheld — its
# orders/paid webhook is disabled above pending Protected Customer Data
# approval. Keep in sync with SHOPIFY_SCOPES in workers/app-backend/wrangler.toml.
scopes = "read_inventory,read_locations,write_products,write_cart_transforms,write_publications"

[auth]
redirect_urls = [ "https://box-craft-app-backend.adam-bourg.workers.dev/auth/callback" ]
