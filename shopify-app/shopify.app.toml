# Hand-scaffolded to match the structure `shopify app init` generates.
# client_id and dev_store_url below are real. application_url and the
# auth redirect URL are still placeholders — there's no app-backend
# service in this codebase yet to host them (OAuth install flow, embedded
# admin UI, AppSubscription billing). Fill these in once that exists, or
# run `shopify app dev` locally, which auto-tunnels and fills
# application_url in for you during development. See
# specs/product/assumptions.md.

client_id = "d3f114303ecd6de5e650b4bdb96106f6"
name = "BoxCraft"
handle = "boxcraft"
application_url = "https://REPLACE_WITH_APP_URL"
embedded = true

[build]
automatically_update_urls_on_dev = true
dev_store_url = "box-craft-demo.myshopify.com"

[webhooks]
api_version = "2026-01"

  [[webhooks.subscriptions]]
  topics = [ "app/uninstalled" ]
  uri = "/webhooks/app/uninstalled"

[access_scopes]
# read_inventory + read_locations: the Guardrail Worker's backfill script
# and the webhook consumer's inventory_levels/update subscription both
# need these. read_products: theme app extension needs variant data for
# the Pick-N picker config.
scopes = "read_inventory,read_locations,read_products"

[auth]
redirect_urls = [ "https://REPLACE_WITH_APP_URL/auth/callback" ]
