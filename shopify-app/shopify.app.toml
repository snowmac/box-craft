# Hand-scaffolded to match the structure `shopify app init` generates.
# client_id below is the real Partner app's client ID. application_url,
# dev_store_url, and the auth redirect URL are still placeholders — fill
# those in (or run `shopify app config link` from this directory) once
# the app has a real hosted URL and dev store handle. See
# specs/product/assumptions.md.

client_id = "d3f114303ecd6de5e650b4bdb96106f6"
name = "BoxCraft"
handle = "boxcraft"
application_url = "https://REPLACE_WITH_APP_URL"
embedded = true

[build]
automatically_update_urls_on_dev = true
dev_store_url = "REPLACE_WITH_DEV_STORE.myshopify.com"

[webhooks]
api_version = "2026-01"

  [[webhooks.subscriptions]]
  topics = [ "app/uninstalled" ]
  uri = "/webhooks/app/uninstalled"

[access_scopes]
# read_inventory + read_locations: the Guardrail Worker's backfill script
# and the webhook consumer's inventory_levels/update subscription both
# need these. read_products: theme app extension needs variant data for
# the Pick-N picker config.
scopes = "read_inventory,read_locations,read_products"

[auth]
redirect_urls = [ "https://REPLACE_WITH_APP_URL/auth/callback" ]
