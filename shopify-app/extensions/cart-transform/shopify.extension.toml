# Shape follows the official functions-cart-transform-js template from
# Shopify/extensions-templates. build.command is empty because the CLI
# compiles JS functions itself (typegen + esbuild + javy -> wasm).

api_version = "2026-07"

[[extensions]]
name = "boxcraft-cart-transform"
handle = "boxcraft-cart-transform"
type = "function"

  [[extensions.targeting]]
  target = "cart.transform.run"
  input_query = "src/cart_transform_run.graphql"
  export = "cart-transform-run"

  [extensions.build]
  command = ""
  path = "dist/function.wasm"
