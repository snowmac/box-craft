# Requests only the fields the function actually uses — Shopify explicitly
# recommends this to keep function execution inside its runtime budget.
# See Non-Functional Requirements in specs/product/technical-spec.md.
query CartTransformRunInput {
  # Both written by app-backend (store setup / T5's boxes API) to the
  # cart transform's own metafields — the app-reserved "$app" namespace,
  # since no namespace is given. D11: the function computes its own price
  # from `boxes` rather than trusting anything from the cart/storefront.
  cartTransform {
    metafield(key: "bundle_parent_variant_id") {
      value
    }
    boxes: metafield(key: "boxes") {
      value
    }
  }
  cart {
    lines {
      id
      quantity
      bundleId: attribute(key: "_bundle_id") {
        value
      }
      bundleBox: attribute(key: "_bundle_box") {
        value
      }
      sellingPlanAllocation {
        sellingPlan {
          id
        }
      }
    }
  }
}
