name = "box-craft-ops"
main = "src/index.ts"
compatibility_date = "2026-09-22"

[observability]
enabled = true

[vars]
# Not currently called from here (see actions.ts's forceSetupReRun — the
# operator has no id_token to actually exchange, so that action just
# clears setupAt and lets app-backend's own next page load redo the real
# OAuth work) — kept for parity with the plan's declared bindings and in
# case a future action needs it. Not sensitive on its own (same value as
# shopify.app.toml's client_id).
SHOPIFY_CLIENT_ID = "d3f114303ecd6de5e650b4bdb96106f6"

# T14: the three public Workers' own URLs, for the Overview page's health
# checks (server-side GET /health) and the Guardrail tester's live /check
# call. Same values as shopify-app/extensions/pick-n-picker's default
# guardrail_worker_url setting and the other two wrangler.toml files.
GUARDRAIL_WORKER_URL = "https://box-craft.adam-bourg.workers.dev"
WEBHOOK_CONSUMER_URL = "https://box-craft-webhook-consumer.adam-bourg.workers.dev"
APP_BACKEND_URL = "https://box-craft-app-backend.adam-bourg.workers.dev"

# Same KV namespaces as the other Workers — this console only ever reads
# them (by convention; nothing in the bindings themselves enforces that).
[[kv_namespaces]]
binding = "SHOP_TOKENS"
id = "0a36a18ea3344074a5bec4e4c2575f1e"

[[kv_namespaces]]
binding = "LOCATION_BITMAP"
id = "fd681a5957544826b82e98f16df52950"

# OPS_TOKEN and SHOPIFY_CLIENT_SECRET are set as Worker secrets (not
# stored here). To set OPS_TOKEN (generate a random string first, then
# store it in the local keychain per the plan — never print it):
#   npx wrangler secret put OPS_TOKEN
#   npx wrangler secret put SHOPIFY_CLIENT_SECRET

# Same D1 database as the other Workers (see ../../wrangler.toml).
[[d1_databases]]
binding = "DB"
database_name = "boxcraft"
database_id = "064bd58d-0d20-42a0-af37-9e6d324708b2"
