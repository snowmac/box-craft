name = "box-craft-ops"
main = "src/index.ts"
compatibility_date = "2026-09-22"

[observability]
enabled = true

[vars]
# Only used by T14's "force token re-exchange" action, which needs to call
# Shopify's OAuth token endpoint the same way app-backend does. Not
# sensitive on its own (same value as shopify.app.toml's client_id).
SHOPIFY_CLIENT_ID = "d3f114303ecd6de5e650b4bdb96106f6"

# Same KV namespaces as the other Workers — this console only ever reads
# them (by convention; nothing in the bindings themselves enforces that).
[[kv_namespaces]]
binding = "SHOP_TOKENS"
id = "0a36a18ea3344074a5bec4e4c2575f1e"

[[kv_namespaces]]
binding = "LOCATION_BITMAP"
id = "fd681a5957544826b82e98f16df52950"

# OPS_TOKEN and SHOPIFY_CLIENT_SECRET are set as Worker secrets (not
# stored here). To set OPS_TOKEN (generate a random string first, then
# store it in the local keychain per the plan — never print it):
#   npx wrangler secret put OPS_TOKEN
#   npx wrangler secret put SHOPIFY_CLIENT_SECRET

# Same D1 database as the other Workers (see ../../wrangler.toml) — not
# yet provisioned.
# [[d1_databases]]
# binding = "DB"
# database_name = "boxcraft"
# database_id = ""
