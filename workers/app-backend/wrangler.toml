name = "box-craft-app-backend"
main = "src/index.ts"
compatibility_date = "2026-09-22"

[observability]
enabled = true

[vars]
SHOPIFY_CLIENT_ID = "d3f114303ecd6de5e650b4bdb96106f6"
SHOPIFY_SCOPES = "read_inventory,read_locations,write_products,write_cart_transforms,write_publications"
# Same value as shopify.app.toml's application_url.
APP_URL = "https://box-craft-app-backend.adam-bourg.workers.dev"

# Stores {shop -> access token} after install. A separate namespace from
# the Guardrail Worker's LOCATION_BITMAP — different sensitivity (this
# holds merchant secrets), different lifecycle.
[[kv_namespaces]]
binding = "SHOP_TOKENS"
id = "0a36a18ea3344074a5bec4e4c2575f1e"

# SHOPIFY_CLIENT_SECRET and SHOPIFY_WEBHOOK_SECRET are set as Worker
# secrets (not stored here). To rotate either:
#   npx wrangler secret put SHOPIFY_CLIENT_SECRET
#   npx wrangler secret put SHOPIFY_WEBHOOK_SECRET

# Same D1 database as the Guardrail Worker's DB binding (see
# ../../wrangler.toml) — not yet provisioned.
# [[d1_databases]]
# binding = "DB"
# database_name = "boxcraft"
# database_id = ""
