name = "box-craft-app-backend"
main = "src/index.ts"
compatibility_date = "2026-09-22"

[vars]
SHOPIFY_CLIENT_ID = "d3f114303ecd6de5e650b4bdb96106f6"
SHOPIFY_SCOPES = "read_inventory,read_locations,read_products"
# Set once this Worker has a real deployed URL (same value that then goes
# into shopify.app.toml's application_url). Placeholder until then — see
# specs/product/assumptions.md.
APP_URL = "https://REPLACE_WITH_APP_URL"

# Stores {shop -> access token} after install. A separate namespace from
# the Guardrail Worker's LOCATION_BITMAP — different sensitivity (this
# holds merchant secrets), different lifecycle. Not yet provisioned in
# this environment. Create with:
#   npx wrangler kv namespace create SHOP_TOKENS
# [[kv_namespaces]]
# binding = "SHOP_TOKENS"
# id = ""

# Set with:
#   npx wrangler secret put SHOPIFY_CLIENT_SECRET
#   npx wrangler secret put SHOPIFY_WEBHOOK_SECRET
# (client secret from the Partner Dashboard app credentials; webhook
# secret from the same place the webhook consumer's secret comes from —
# can be the same value if using one webhook signing secret app-wide.)
