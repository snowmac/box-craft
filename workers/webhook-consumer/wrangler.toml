name = "box-craft-webhook-consumer"
main = "src/index.ts"
compatibility_date = "2026-09-22"

[observability]
enabled = true

[[durable_objects.bindings]]
name = "SKU_DEBOUNCER"
class_name = "SkuDebouncer"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["SkuDebouncer"]

# Same KV namespace id as the Guardrail Worker's LOCATION_BITMAP binding
# (see ../../wrangler.toml) — this Worker also uses it to read the
# inventory_item_id -> variant GID lookup the backfill script populates
# (see shared/bitmap.ts inventoryItemMapKey).
[[kv_namespaces]]
binding = "LOCATION_BITMAP"
id = "fd681a5957544826b82e98f16df52950"

# Set with: npx wrangler secret put SHOPIFY_WEBHOOK_SECRET
# (Shopify's webhook signing secret, from the app's Partner Dashboard
# credentials — not yet available in this environment.)

# Same D1 database as the Guardrail Worker's DB binding (see
# ../../wrangler.toml) — not yet provisioned.
# [[d1_databases]]
# binding = "DB"
# database_name = "boxcraft"
# database_id = ""
